<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1>BAG TRACKER</h1>

            <ul class="nav-links">
                <li><a href="#currency">Currency</a></li>
                <li><a href="#expenses">Expenses</a></li>
                <li><a href="#exchange-rates-api">Exchange Rates API</a></li>
            </ul>
        </nav>

        <section class="hero">
            <p class="subtitle">HEHA Foreign Exchange</p>
            <h2>Track Your BAGs</h2>
            <a class="cta-button" href="#currency">Get Started</a>
        </section>
    </header>

    <main>
        <section id="currency">
            <h2>Add an expense</h2>

            <form id="expense-form">
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" placeholder="For an example: Groceries" maxlength="100" required>

                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" step="0.01" placeholder="Enter amount" max="1000000000000000" step="0.01" min="0.001" required>

                <label for="currency">Currency:</label>
                <select id="currency" name="currency" required>
                    <option value="USD">USD- US Dollar</option>
                    <option value="EUR">EUR- Euro</option>
                    <option value="GBP">GBP- British Pound</option>
                    <option value="JPY">JPY- Japanese Yen</option>
                    <option value="AUD">AUD- Australian Dollar</option>
                    <option value="CAD">CAD- Canadian Dollar</option>
                    <option value="KSH">KSH- Kenyan Shilling</option>
                    <option value="UGX">UGX- Ugandan Shilling</option>
                    <option value="TZS">TZS- Tanzanian Shilling</option>
                    <option value="ZAR">ZAR- South African Rand</option>
                </select>
                <label for="Category">Category</label>
                <select id="category-list">
                    <option value="Flight bookings">Flight bookings</option>
                    <option value="Dining in watamu">Dining in watamu</option>
                    <option value="Nganya road trips">Nganya road trips</option>
                    <option value="Shopping">Shopping</option>
                </select>


                <button type="submit" id="add-expense-btn">Add Expense</button>
                <p id="form-error" class="error-message"></p>
            </form>
        </section>

        <section id="expense">
            <h2>Expense</h2>
            
        </section>
    

            
        </section>  


        </section>
    </main>
</body>
</html>
